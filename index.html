<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Halo & Hue Listing Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border-radius: 18px;
      padding: 22px;
      margin-top: 20px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .tagline {
      color: #cbd5e1;
      margin-top: 0;
    }

    .upload-box {
      border: 2px dashed #94a3b8;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      margin-top: 20px;
    }

    input[type="file"] {
      width: 100%;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #uploadButton {
      background: #ffffff;
      color: #0f172a;
    }

    #copyButton {
      background: #334155;
      color: white;
    }

    #copyButton:disabled,
    #uploadButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      line-height: 1.5;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .preview-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #334155;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      resize: vertical;
    }

    .small {
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Halo & Hue</h1>
  <p class="tagline">Unique Finds • Custom Creations</p>

  <div class="card">

    <h2>eBay Photo Uploader</h2>

    <p>
      Select your listing photos from your phone and upload them
      to your Halo & Hue Cloudinary account.
    </p>

    <div class="upload-box">

      <input
        type="file"
        id="photoInput"
        accept="image/*"
        multiple
      >

      <button id="uploadButton">
        Upload Photos
      </button>

    </div>

    <div id="status">
      No photos uploaded yet.
    </div>

    <div id="previewGrid" class="preview-grid"></div>

  </div>

  <div class="card">

    <h2>eBay Image URLs</h2>

    <p class="small">
      These are the public image links that can be used for your eBay draft.
    </p>

    <textarea
      id="urlOutput"
      readonly
      placeholder="Your Cloudinary image URLs will appear here..."
    ></textarea>

    <button id="copyButton" disabled>
      Copy All URLs
    </button>

  </div>

</div>

<script>

const CLOUD_NAME = "wcakkjdv";
const UPLOAD_PRESET = "halo_hue_ebay";

const photoInput = document.getElementById("photoInput");
const uploadButton = document.getElementById("uploadButton");
const copyButton = document.getElementById("copyButton");

const statusBox = document.getElementById("status");
const previewGrid = document.getElementById("previewGrid");
const urlOutput = document.getElementById("urlOutput");

let uploadedUrls = [];

uploadButton.addEventListener("click", async () => {

  const files = photoInput.files;

  if (!files.length) {
    statusBox.textContent = "Please select at least one photo.";
    return;
  }

  uploadButton.disabled = true;
  copyButton.disabled = true;

  uploadedUrls = [];
  previewGrid.innerHTML = "";
  urlOutput.value = "";

  let successfulUploads = 0;

  for (let i = 0; i < files.length; i++) {

    statusBox.textContent =
      `Uploading photo ${i + 1} of ${files.length}...`;

    const formData = new FormData();

    formData.append("file", files[i]);
    formData.append("upload_preset", UPLOAD_PRESET);

    try {

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data?.error?.message || "Cloudinary upload failed."
        );
      }

      const imageUrl = data.secure_url;

      uploadedUrls.push(imageUrl);

      const image = document.createElement("img");
      image.src = imageUrl;
      image.alt = `Uploaded listing photo ${i + 1}`;

      previewGrid.appendChild(image);

      successfulUploads++;

      urlOutput.value = uploadedUrls.join("\n");

    } catch (error) {

      console.error(error);

      statusBox.textContent =
        `Photo ${i + 1} failed: ${error.message}`;

    }

  }

  if (successfulUploads === files.length) {

    statusBox.textContent =
      `✅ All ${successfulUploads} photos uploaded successfully.`;

  } else {

    statusBox.textContent =
      `⚠️ ${successfulUploads} of ${files.length} photos uploaded successfully.`;

  }

  uploadButton.disabled = false;

  if (uploadedUrls.length) {
    copyButton.disabled = false;
  }

});


copyButton.addEventListener("click", async () => {

  if (!uploadedUrls.length) {
    return;
  }

  try {

    await navigator.clipboard.writeText(
      uploadedUrls.join("\n")
    );

    copyButton.textContent = "✓ URLs Copied";

    setTimeout(() => {
      copyButton.textContent = "Copy All URLs";
    }, 2000);

  } catch (error) {

    urlOutput.select();
    document.execCommand("copy");

    copyButton.textContent = "✓ URLs Copied";

  }

});

</script>

</body>
</html>
